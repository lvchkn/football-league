<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Fantasy Football Simulator</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="icon" href="/favicon-96x96.png" />
    </head>

    <body>
        <h1>Fantasy Football Simulator</h1>

        <div class="mode-switch" role="group" aria-label="Mode">
            <button type="button" data-mode="classic">Classic</button>
            <button type="button" data-mode="career">Career</button>
        </div>

        <label for="league-selector">Choose a league:</label>
        <select id="league-selector" aria-label="Select league">
            <!-- Filled from src/competitions.ts -->
        </select>

        <div id="career-bar" class="career-bar" hidden></div>

        <div class="container">
            <div class="standings-section">
                <h2>Standings</h2>
                <table id="standings" class="standings-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Team</th>
                            <th>Played</th>
                            <th>W</th>
                            <th>D</th>
                            <th>L</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>GD</th>
                            <th>Pts</th>
                            <th>Form</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div id="group-standings"></div>
            </div>

            <div class="fixtures-section">
                <h2>
                    Fixtures
                    <button id="save-btn" style="margin-left: 12px">
                        Save
                    </button>
                    <button id="reset-btn" style="margin-left: 6px">
                        Reset scores
                    </button>
                    <button id="regenerate-btn" style="margin-left: 6px">
                        Regenerate fixtures
                    </button>
                </h2>
                <div id="fixtures"></div>
            </div>
        </div>

        <button
            id="scroll-to-top"
            class="scroll-to-top"
            aria-label="Scroll to top"
        >
            ↑
        </button>

        <script type="module" src="src/app.ts"></script>
    </body>
</html>
